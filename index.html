<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="imgprint — print images on paper, locally in your browser. No upload, no account.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>imgprint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M8 21.5l5.2-6.2 3.4 4 2.6-3.1 5 5.3z' fill='%23fff'/%3E%3Ccircle cx='12.2' cy='11.4' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   imgprint — 图片打印器
   单文件、离线、纯本地。视觉：白底 + 蓝（#2f6fed），与 md2pdf 同一套调性。
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{
  --bg:#f3f6fb;
  --panel:#fff;
  --text:#1b1d21;
  --muted:#6b7280;
  --line:#e3e8f1;
  --line-strong:#cfd9ea;
  --accent:#2f6fed;
  --accent-hover:#245ed6;
  --accent-weak:#eaf1ff;
  --ink-soft:#4b5563;
  --ok:#1f7a4d;
  --warn:#8a5200;
  --warn-bg:#fff7e8;
  --warn-line:#f0dbb0;
  --radius:12px;
  --radius-sm:8px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 var(--sans);
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:18px;height:18px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 20px;
  background:rgba(255,255,255,.88);
  border-bottom:1px solid var(--line);
  backdrop-filter:saturate(180%) blur(10px);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:32px;height:32px;flex:none;border-radius:9px;
  background:linear-gradient(180deg,#4b83f5,#2f6fed);
  display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(47,111,237,.35);
}
.logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:15.5px;line-height:1.15;letter-spacing:-.01em}
.brand-text small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;align-items:center;gap:6px;color:var(--muted)}
.lang .ico{width:16px;height:16px}
.lang select{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 6px;max-width:158px;color:var(--text);font-size:13px;
}
.icon-btn{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-soft);border:1px solid transparent;
}
.icon-btn:hover{background:#eef2f9;color:var(--text)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;padding:0 16px;border-radius:9px;
  border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;
  white-space:nowrap;
}
.btn:hover{background:#f6f8fc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{color:var(--muted);border-color:var(--line);background:#fbfcfe}
.btn .ico{width:16px;height:16px}

/* ---------- layout ---------- */
.layout{
  width:100%;max-width:1440px;margin:0 auto;flex:1;
  padding:18px 20px 10px;
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start;
}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.side{
  position:sticky;top:74px;
  max-height:calc(100vh - 92px);
  padding:14px;display:flex;flex-direction:column;gap:12px;
  min-height:0;
}
.side-head{display:flex;align-items:center;gap:8px;min-height:24px}
.side-head h2{
  margin:0;font-size:11.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
}
.count{
  display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:999px;background:var(--accent-weak);color:var(--accent);
  font-size:11px;font-weight:700;
}
.side-head .btn{margin-left:auto;height:30px;padding:0 10px;font-size:12px}

/* ---------- dropzone ---------- */
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:10px;background:#fbfcff;
  color:var(--muted);text-align:center;cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:14px 12px;
}
.dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);background:var(--accent-weak)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-weak);border-style:solid}
.dropzone.big{flex:1;min-height:300px;padding:26px 18px;gap:7px}
.dropzone .drop-ico{
  width:44px;height:44px;border-radius:12px;background:var(--accent-weak);
  display:grid;place-items:center;color:var(--accent);margin-bottom:2px;
}
.dropzone .drop-ico .ico{width:22px;height:22px}
.dropzone b{color:var(--text);font-size:13.5px;line-height:1.4}
.dropzone span{font-size:12px;line-height:1.45}
.dropzone .fake-btn{
  display:inline-flex;align-items:center;height:32px;padding:0 14px;margin-top:4px;
  border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;
}
.dropzone .formats{font-family:var(--mono);font-size:10.5px;color:#9aa3b2;letter-spacing:.02em}
.dropzone.big .local{margin-top:6px;font-size:11.5px;color:#8a93a3}

/* ---------- image list ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
.list[hidden]{display:none}
.card{
  display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;
}
.card:hover{border-color:var(--line-strong);background:#fcfdff}
.thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#eef2f8;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{min-width:0}
.card .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{
  display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;
  background:#f1f4f9;color:#59636f;border:1px solid #e6eaf1;white-space:nowrap;
}
.chip.ok{background:#eef8f2;color:var(--ok);border-color:#d6eee0}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.chip.muted{color:#8a93a3}
.actions{display:flex;flex-direction:column;gap:2px}
.mini{
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  color:#8a93a3;border:1px solid transparent;
}
.mini:hover{background:#eef2f9;color:var(--text)}
.mini .ico{width:14px;height:14px}
.mini[disabled]{opacity:.25;cursor:default}
@media (hover:hover){
  .actions{opacity:0;transition:opacity .12s ease}
  .card:hover .actions,.card:focus-within .actions{opacity:1}
}
.more{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:36px;border:1px dashed var(--line-strong);border-radius:9px;
  color:var(--accent);font-weight:600;font-size:12.5px;background:#fbfcff;
}
.more:hover{background:var(--accent-weak);border-color:var(--accent)}
.more[hidden]{display:none}

/* ---------- preview ---------- */
.preview{padding:14px;min-height:60vh;display:flex;flex-direction:column}
.preview-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:1px 2px 12px}
.preview-head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.status .sep{width:3px;height:3px;border-radius:50%;background:#c6cedb}
.status .ready{color:var(--ok);font-weight:600}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0 2px 12px}
.alerts[hidden]{display:none}
.alert{
  display:flex;gap:10px;padding:10px 12px;border:1px solid var(--warn-line);
  background:var(--warn-bg);border-radius:10px;color:#5c3a00;
}
.alert .alert-ico{
  width:20px;height:20px;flex:none;border-radius:50%;background:#f3c969;color:#5c3a00;
  display:grid;place-items:center;font-weight:800;font-size:12px;margin-top:1px;
}
.alert b{display:block;font-size:12.5px;line-height:1.4}
.alert p{margin:2px 0 0;font-size:12px;line-height:1.55;color:#6b4a12}
.alert .mini{margin-left:auto;align-self:flex-start;color:#8a5200}
.alert .mini:hover{background:#f7e6c2;color:#5c3a00}

#sheets{display:flex;flex-direction:column;align-items:center;gap:22px;padding:4px 0 8px}
.preview-empty{
  flex:1;min-height:340px;display:grid;place-items:center;
  color:var(--muted);font-size:13px;text-align:center;padding:24px;
  border:1px dashed var(--line);border-radius:10px;background:#fbfcff;margin:2px;
}
.preview-empty[hidden]{display:none}

/* ---------- printed sheet (screen preview == print layout) ---------- */
.sheet-wrap{position:relative;margin:0 auto;flex:none}
.sheet{
  position:absolute;left:0;top:0;transform-origin:0 0;
  width:var(--pw);height:var(--ph);background:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.10),0 14px 34px rgba(16,24,40,.12);
  overflow:hidden;
}
.sheet-inner{
  position:absolute;inset:var(--mg);
  display:grid;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows),minmax(0,1fr));
  gap:var(--gap);
}
.slot{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.slot .imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.slot img{display:block;width:100%;height:100%;object-fit:contain}
.slot img.cover{object-fit:cover}
.slot .cap{
  flex:none;font-size:7.5pt;line-height:1.3;color:#6b7280;text-align:center;
  padding-top:1.2mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wm{
  position:absolute;left:0;right:0;bottom:2.2mm;
  text-align:center;font-size:6.5pt;line-height:1.5;color:#8a93a3;
  letter-spacing:.02em;padding:0 4mm;word-break:break-word;
}
.wm a{color:inherit;text-decoration:none}
.wm .site{color:#2f6fed;font-weight:600}
.wm .sep{opacity:.5;padding:0 2px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:40;border:0}
.scrim[hidden]{display:none}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(382px,100vw);z-index:50;
  background:#fff;box-shadow:-12px 0 40px rgba(16,24,40,.18);
  display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .22s ease;
  visibility:hidden;
}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.drawer-head h2{margin:0;font-size:15px;letter-spacing:-.01em}
.drawer-head .icon-btn{margin-left:auto}
.drawer-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field select{
  height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
  background:#fff;font-size:13.5px;
}
.field select:hover{border-color:var(--line-strong)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.hint{margin:-6px 0 0;font-size:12px;color:var(--muted);line-height:1.55}
.drawer h3{
  margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);
}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.tips li::marker{color:var(--accent)}
.drawer .btn{margin-top:4px}

/* ---------- misc ---------- */
#sheets[hidden]{display:none}
.dropzone:not(.big) .local{display:none}
.dropzone:not(.big) .formats{display:none}
.noscript{margin:0;padding:14px 20px;background:var(--warn-bg);color:var(--warn);text-align:center}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:#1b1d21;color:#fff;padding:9px 14px;border-radius:10px;
  font-size:13px;line-height:1.45;max-width:min(560px,calc(100vw - 40px));
  box-shadow:0 12px 34px rgba(0,0,0,.28);
}
.toast[hidden]{display:none}

/* ---------- footer ---------- */
.foot{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:14px 20px 22px;color:var(--muted);font-size:12px;
}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--accent)}
.foot .sep{opacity:.45}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .layout{grid-template-columns:1fr;gap:14px}
  .side{position:static;max-height:none}
  .side .list{max-height:44vh}
  .brand-text small{display:none}
}
@media (max-width:600px){
  .top{padding:9px 12px}
  .layout{padding:12px 12px 6px}
  .btn{padding:0 12px}
  .lang select{max-width:112px}
  .preview{padding:10px}
}

/* ---------- print ---------- */
@media print{
  html,body{background:#fff!important}
  body{display:block}
  .top,.side,.foot,.drawer,.scrim,.toast,.preview-head,.alerts,.preview-empty{display:none!important}
  .layout{display:block!important;padding:0!important;max-width:none!important}
  .preview{padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;min-height:0!important}
  #sheets{display:block!important;padding:0!important;gap:0!important}
  .sheet-wrap{position:static!important;width:auto!important;height:auto!important;margin:0!important;break-after:page}
  .sheet{
    position:static!important;transform:none!important;
    box-shadow:none!important;border-radius:0!important;
    width:var(--pw);height:var(--ph);
  }
  .sheet-wrap:last-child{break-after:auto}
  .sheet-wrap:last-child .sheet{break-after:auto}
}
@media (prefers-reduced-motion:reduce){
  .drawer{transition:none}
  .dropzone{transition:none}
}
</style>
</head>
<body>
<noscript><p class="noscript">imgprint needs JavaScript to run — everything stays on your device.</p></noscript>

<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 15l4.6-4.8 3.2 3.4 2.4-2.8L20 16"/><circle cx="9.2" cy="8.6" r="1.4"/></svg></span>
    <span class="brand-text"><b>imgprint</b><small data-i18n="app.tagline"></small></span>
  </div>
  <div class="top-actions">
    <label class="lang">
      <span class="sr-only" data-i18n="a11y.lang"></span>
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-globe"></use></svg>
      <select id="langSel"></select>
    </label>
    <button id="btnSettings" class="icon-btn" type="button" data-i18n-aria="a11y.settings" data-i18n-title="btn.settings">
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
    </button>
    <button id="btnPrint" class="btn primary" type="button" data-i18n-aria="a11y.print" disabled>
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-print"></use></svg><span data-i18n="btn.print"></span>
    </button>
  </div>
</header>

<main class="layout">
  <section class="side panel" aria-labelledby="sideTitle">
    <div class="side-head">
      <h2 id="sideTitle" data-i18n="images.title"></h2>
      <span id="imgCount" class="count" hidden>0</span>
    </div>
    <div id="dropzone" class="dropzone big" role="button" tabindex="0" aria-labelledby="dropTitle">
      <span class="drop-ico" aria-hidden="true"><svg class="ico" focusable="false"><use href="#i-photo"></use></svg></span>
      <b id="dropTitle" data-i18n="drop.title"></b>
      <span data-i18n="drop.sub"></span>
      <span class="fake-btn" data-i18n="btn.pick"></span>
      <span class="formats" data-i18n="drop.formats"></span>
      <span class="local" data-i18n="drop.local"></span>
    </div>
    <ol id="imgList" class="list" hidden></ol>
  </section>

  <section class="preview panel" aria-labelledby="previewTitle">
    <div class="preview-head">
      <h2 id="previewTitle" data-i18n="preview.title"></h2>
      <div id="status" class="status"></div>
    </div>
    <div id="alerts" class="alerts" hidden></div>
    <div id="sheets" hidden></div>
    <div id="previewEmpty" class="preview-empty" data-i18n="preview.empty"></div>
  </section>
</main>

<footer class="foot">
  <span data-i18n="footer.local"></span>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://github.com/w32394045-dotcom/imgprint" target="_blank" rel="noopener noreferrer">github.com/w32394045-dotcom/imgprint</a>
  <span class="sep" aria-hidden="true">·</span>
  <span data-i18n="footer.license"></span>
</footer>

<div id="scrim" class="scrim" hidden></div>
<aside id="settings" class="drawer" role="dialog" aria-modal="true" aria-labelledby="setTitle" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="setTitle" data-i18n="set.title"></h2>
    <button id="btnClose" class="icon-btn" type="button" data-i18n-aria="btn.close" data-i18n-title="btn.close">
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="drawer-body">
    <label class="field"><span data-i18n="set.paper"></span>
      <select id="optPaper">
        <option value="a4" data-i18n="paper.a4"></option>
        <option value="a5" data-i18n="paper.a5"></option>
        <option value="b5" data-i18n="paper.b5"></option>
        <option value="letter" data-i18n="paper.letter"></option>
        <option value="photo" data-i18n="paper.photo"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="set.orient"></span>
      <select id="optOrient">
        <option value="p" data-i18n="orient.portrait"></option>
        <option value="l" data-i18n="orient.landscape"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="set.margin"></span>
      <select id="optMargin">
        <option value="none" data-i18n="margin.none"></option>
        <option value="narrow" data-i18n="margin.narrow"></option>
        <option value="wide" data-i18n="margin.wide"></option>
      </select>

      else if (/prophoto|romm/.test(dlow)) space = 'prophoto';

    } else if (info.exifColorSpace === 1) {

    } else if (info.spaceHint === 'hdr') {
      space = 'hdr';
    } else if (info.spaceHint === 'p3') {
      space = 'p3';
    } else if (info.spaceHint === 'srgb') {
      space = 'srgb';

  /* ---------- read metadata for one file ---------- */
  async function readMeta(u8, mime) {

      else if (m.indexOf('png') >= 0) fmt = 'png';
      else if (m.indexOf('webp') >= 0) fmt = 'webp';
      else if (m.indexOf('gif') >= 0) fmt = 'gif';
      else if (m.indexOf('bmp') >= 0) fmt = 'bmp';
      else if (m.indexOf('avif') >= 0) fmt = 'avif';
      else if (m.indexOf('hei') >= 0) fmt = 'heic';

var APP = (function () {

  function moveImage(id, delta) {
    var i = indexOfId(id);
    var j = i + delta;
    if (i < 0 || j < 0 || j >= state.images.length) return;
    var tmp = state.images[i];
    state.images[i] = state.images[j];
    state.images[j] = tmp;
    renderAll();
  }

  /* ---------------- rendering ---------------- */
  function scheduleRender() {
    if (state.renderQueued) return;
    state.renderQueued = true;
    var raf = window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };
    raf(function () {
      state.renderQueued = false;
      renderAll();
    });
  }

  function colorChip(im) {
    if (!im.meta) return chip('…', 'muted', '');
    var def = COLOR_META[im.meta.space] || COLOR_META.unknown;
    return chip(t(def.key), def.cls, t(def.tip));
  }

  function dpiChip(im, lay) {
    var d = CORE.dpiFor(im.w, im.h, lay.slotW, lay.slotH, state.cfg.fit);
    if (!(d > 0)) return chip('…', 'muted', t('badge.dpiT'));
    var n = Math.round(d);
    var cls = '', key = 'badge.dpi';
    if (d >= 300) cls = 'ok';
    else if (d < 150) { cls = 'warn'; key = 'badge.dpiBad'; }
    else key = 'badge.dpiLow';
    return chip(t(key, n), cls, t('badge.dpiT'));
  }

  function actionButton(act, iconId, label, disabled) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.setAttribute('data-act', act);
    b.setAttribute('aria-label', label);
    b.setAttribute('title', label);
    if (disabled) b.disabled = true;
    b.appendChild(icon(iconId));
    return b;
  }

  function renderList() {
    var list = el.imgList;
    clear(list);
    var n = state.images.length;
    el.imgCount.hidden = n === 0;
    el.imgCount.textContent = String(n);
    el.dropzone.classList.toggle('big', n === 0);
    if (!n) {
      list.hidden = true;
      return;
    }
    list.hidden = false;
    var lay = CORE.layoutFor(state.cfg);
    for (var i = 0; i < n; i++) {
      var im = state.images[i];
      var li = document.createElement('li');
      li.className = 'card';
      li.setAttribute('data-id', im.id);
      li.setAttribute('data-index', String(i + 1));

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      var timg = document.createElement('img');
      timg.src = im.url;
      timg.alt = '';
      timg.loading = 'lazy';
      thumb.appendChild(timg);

      var body = document.createElement('div');
      body.className = 'card-body';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = im.name;
      name.title = im.name;
      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = (im.w && im.h ? im.w + ' × ' + im.h + ' · ' : '') + CORE.formatBytes(im.size);
      var chips = document.createElement('div');
      chips.className = 'chips';
      chips.appendChild(colorChip(im));
      chips.appendChild(dpiChip(im, lay));
      body.appendChild(name);
      body.appendChild(sub);
      body.appendChild(chips);

      var actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(actionButton('up', 'i-up', t('a11y.moveUp'), i === 0));
      actions.appendChild(actionButton('down', 'i-down', t('a11y.moveDown'), i === n - 1));
      actions.appendChild(actionButton('remove', 'i-trash', t('a11y.remove'), false));

      li.appendChild(thumb);
      li.appendChild(body);
      li.appendChild(actions);
      list.appendChild(li);
    }
  }

  function watermark() {
    var wm = document.createElement('div');
    wm.className = 'wm';
    var site = document.createElement('a');
    site.className = 'site';
    site.href = SITE_HREF;
    site.target = '_blank';
    site.rel = 'noopener noreferrer';
    site.textContent = SITE_TEXT;
    var sep = document.createElement('span');
    sep.className = 'sep';
    sep.setAttribute('aria-hidden', 'true');
    sep.textContent = '·';
    var repo = document.createElement('a');
    repo.href = REPO_HREF;
    repo.target = '_blank';
    repo.rel = 'noopener noreferrer';
    repo.textContent = REPO_TEXT;
    wm.appendChild(site);
    wm.appendChild(sep);
    wm.appendChild(repo);
    return wm;
  }

  function buildSheet(lay, indexes) {
    var wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    var sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.style.setProperty('--pw', lay.pageW + 'mm');
    sheet.style.setProperty('--ph', lay.pageH + 'mm');
    sheet.style.setProperty('--mg', lay.margin + 'mm');
    sheet.style.setProperty('--gap', lay.gap + 'mm');
    sheet.style.setProperty('--cols', String(lay.cols));
    sheet.style.setProperty('--rows', String(lay.rows));

    var inner = document.createElement('div');
    inner.className = 'sheet-inner';
    for (var i = 0; i < indexes.length; i++) {
      var im = state.images[indexes[i]];
      var slot = document.createElement('div');
      slot.className = 'slot';
      var box = document.createElement('div');
      box.className = 'imgbox';
      var img = document.createElement('img');
      img.src = im.url;
      img.alt = '';
      if (state.cfg.fit === 'cover') img.className = 'cover';
      box.appendChild(img);
      slot.appendChild(box);
      if (state.cfg.caption) {
        var cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = im.name;
        slot.appendChild(cap);
      }
      inner.appendChild(slot);
    }
    sheet.appendChild(inner);
    if (state.cfg.watermark) sheet.appendChild(watermark());
    wrap.appendChild(sheet);
    return wrap;
  }

  function renderSheets() {
    var host = el.sheets;
    clear(host);
    var n = state.images.length;
    el.previewEmpty.hidden = n > 0;
    if (!n) {
      host.hidden = true;
      return;
    }
    host.hidden = false;
    var lay = CORE.layoutFor(state.cfg);
    var pages = CORE.paginate(n, lay.per);
    for (var p = 0; p < pages.length; p++) host.appendChild(buildSheet(lay, pages[p]));
  }

  function renderStatus() {
    var host = el.status;
    clear(host);
    var n = state.images.length;
    if (!n) {
      var none = document.createElement('span');
      none.textContent = t('status.none');
      host.appendChild(none);
      return;
    }
    var lay = CORE.layoutFor(state.cfg);
    var pages = CORE.paginate(n, lay.per).length;
    var parts = [t('status.images', n), t('status.perPage', lay.per), t('status.pages', pages)];
    for (var i = 0; i < parts.length; i++) {
      if (i) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.setAttribute('aria-hidden', 'true');
        host.appendChild(sep);
      }
      var s = document.createElement('span');
      s.textContent = parts[i];
      host.appendChild(s);
    }
    var dot = document.createElement('span');
    dot.className = 'sep';
    dot.setAttribute('aria-hidden', 'true');
    host.appendChild(dot);
    var ready = document.createElement('span');
    ready.className = 'ready';
    ready.textContent = t('status.ready');
    host.appendChild(ready);
  }

  function alertBox(title, body, kind) {
    var box = document.createElement('div');
    box.className = 'alert';
    box.setAttribute('role', 'status');
    var mark = document.createElement('span');
    mark.className = 'alert-ico';
    mark.setAttribute('aria-hidden', 'true');
    mark.textContent = '!';
    var txt = document.createElement('div');
    var b = document.createElement('b');
    b.textContent = title;
    var p = document.createElement('p');
    p.textContent = body;
    txt.appendChild(b);
    txt.appendChild(p);
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'mini';
    close.setAttribute('aria-label', t('btn.close'));
    close.setAttribute('title', t('btn.close'));
    close.appendChild(icon('i-close'));
    close.addEventListener('click', function () {
      state.dismissed[kind] = true;
      renderAlerts();
    });
    box.appendChild(mark);
    box.appendChild(txt);
    box.appendChild(close);
    return box;
  }

  function renderAlerts() {
    var host = el.alerts;
    clear(host);
    var warn = 0;
    var hdr = 0;
    for (var i = 0; i < state.images.length; i++) {
      var m = state.images[i].meta;
      if (!m) continue;
      if (m.space === 'hdr') hdr += 1;
      else if (WARN_SPACES[m.space]) warn += 1;
    }
    var items = [];
    if (warn && !state.dismissed.color) items.push(['alert.colorTitle', warn, 'alert.colorBody', 'color']);
    if (hdr && !state.dismissed.hdr) items.push(['alert.hdrTitle', 0, 'alert.hdrBody', 'hdr']);
    for (var k = 0; k < items.length; k++) {
      var it = items[k];
      var title = it[1] ? t(it[0], it[1]) : t(it[0]);
      host.appendChild(alertBox(title, t(it[2]), it[3]));
    }
    host.hidden = items.length === 0;
  }

  function fitSheets() {
    var wraps = el.sheets.children;
    if (!wraps.length) return;
    var lay = CORE.layoutFor(state.cfg);
    var avail = el.sheets.clientWidth;
    if (!(avail > 0)) return;
    var pxW = lay.pageW * MM_PX;
    var pxH = lay.pageH * MM_PX;
    var k = Math.min(1, (avail - 6) / pxW);
    if (!(k > 0.05)) k = 0.05;
    for (var i = 0; i < wraps.length; i++) {
      wraps[i].style.width = pxW * k + 'px';
      wraps[i].style.height = pxH * k + 'px';
      if (wraps[i].firstChild) wraps[i].firstChild.style.transform = 'scale(' + k + ')';
    }
  }

  function renderAll() {
    renderList();
    renderSheets();
    renderStatus();
    renderAlerts();
    fitSheets();
    el.btnPrint.disabled = state.images.length === 0;
  }

  /* ---------------- drawer ---------------- */
  function openDrawer() {
    el.scrim.hidden = false;
    el.drawer.classList.add('open');
    el.drawer.setAttribute('aria-hidden', 'false');
    el.btnSettings.setAttribute('aria-expanded', 'true');
    el.btnClose.focus();
  }

  function closeDrawer() {
    if (!el.drawer.classList.contains('open')) return;
    el.drawer.classList.remove('open');
    el.drawer.setAttribute('aria-hidden', 'true');
    el.scrim.hidden = true;
    el.btnSettings.setAttribute('aria-expanded', 'false');
    el.btnSettings.focus();
  }

  /* ---------------- boot ---------------- */
  function cache() {
    el.dropzone = $('dropzone');
    el.imgList = $('imgList');
    el.imgCount = $('imgCount');
    el.status = $('status');
    el.alerts = $('alerts');
    el.sheets = $('sheets');
    el.previewEmpty = $('previewEmpty');
    el.toast = $('toast');
    el.fileInput = $('fileInput');
    el.langSel = $('langSel');
    el.btnSettings = $('btnSettings');
    el.btnPrint = $('btnPrint');
    el.btnClose = $('btnClose');
    el.btnReset = $('btnReset');
    el.drawer = $('settings');
    el.scrim = $('scrim');
    el.optPaper = $('optPaper');
    el.optOrient = $('optOrient');
    el.optMargin = $('optMargin');
    el.optPerPage = $('optPerPage');
    el.optFit = $('optFit');
    el.optCaption = $('optCaption');
    el.optWatermark = $('optWatermark');
  }

  function buildLangSelect() {
    for (var i = 0; i < I18N.langs.length; i++) {
      var code = I18N.langs[i];
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = I18N.native[code] || code;
      el.langSel.appendChild(opt);
    }
    el.langSel.value = I18N.lang;
  }

  function pickFiles() {
    el.fileInput.value = '';
    el.fileInput.click();
  }

  function bind() {
    el.dropzone.addEventListener('click', pickFiles);
    el.dropzone.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFiles(); }
    });
    el.fileInput.addEventListener('change', function () {
      addFiles(el.fileInput.files);
      el.fileInput.value = '';
    });

    var dragDepth = 0;
    function setDrag(on) {
      el.dropzone.classList.toggle('drag', !!on);
    }
    document.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragDepth += 1;
      setDrag(true);
    });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('dragleave', function (e) {
      e.preventDefault();
      dragDepth -= 1;
      if (dragDepth <= 0) { dragDepth = 0; setDrag(false); }
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      dragDepth = 0;
      setDrag(false);
      if (e.dataTransfer) addFiles(e.dataTransfer.files);
    });
    document.addEventListener('paste', function (e) {
      if (!e.clipboardData) return;
      var items = e.clipboardData.items || [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) {
        e.preventDefault();
        addFiles(files);
      }
    });

    el.imgList.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!btn) return;
      var card = btn.closest('.card');
      if (!card) return;
      var id = card.getAttribute('data-id');
      var act = btn.getAttribute('data-act');
      if (act === 'up') moveImage(id, -1);
      else if (act === 'down') moveImage(id, 1);
      else if (act === 'remove') removeImage(id);
    });

    el.btnSettings.addEventListener('click', openDrawer);
    el.btnClose.addEventListener('click', closeDrawer);
    el.scrim.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });

    el.btnPrint.addEventListener('click', function () {
      closeDrawer();
      window.print();
    });

    el.langSel.addEventListener('change', function () { setLang(el.langSel.value); });

    var fields = [el.optPaper, el.optOrient, el.optMargin, el.optPerPage, el.optFit, el.optCaption, el.optWatermark];
    for (var i = 0; i < fields.length; i++) fields[i].addEventListener('change', readForm);

    el.btnReset.addEventListener('click', function () {
      var lang = state.cfg.lang;
      state.cfg = CORE.defaults();
      state.cfg.lang = lang;
      writeCfg();
      syncForm();
      updatePageStyle();
      renderAll();
      toast(t('toast.reset'));
    });

    var resizeTimer = 0;
    window.addEventListener('resize', function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { resizeTimer = 0; fitSheets(); }, 120);
    });
  }

  function boot() {
    cache();
    var saved = readCfg();
    state.cfg = CORE.sanitizeCfg(saved);
    if (!saved || I18N.langs.indexOf(state.cfg.lang) < 0) state.cfg.lang = detectLang();
    I18N.setLang(state.cfg.lang);
    buildLangSelect();
    syncForm();
    updatePageStyle();
    applyI18n();
    bind();
    renderAll();
    window.imgprint = {
      version: '1.0.0', core: CORE, i18n: I18N, state: state,
      render: renderAll, addFiles: addFiles, setLang: setLang
    };
  }

  boot();
})();
</script>
</body>
</html>
